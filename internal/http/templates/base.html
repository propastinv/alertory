{{define "base"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alertory</title>
  <script>
    // Applied before first paint so there's no light-mode flash for users
    // who already chose dark - toggle() below keeps this in sync.
    if (localStorage.theme === "dark" || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
  <nav class="bg-slate-900 dark:bg-black text-slate-100 px-6 py-3 flex gap-6 items-center">
    <span class="font-semibold tracking-tight text-white">Alertory</span>
    <a href="/ui/" class="text-sm {{if eq .Active "dashboard"}}text-white font-medium{{else}}text-slate-300 hover:text-white{{end}}">Dashboard</a>
    <a href="/ui/rules" class="text-sm {{if eq .Active "rules"}}text-white font-medium{{else}}text-slate-300 hover:text-white{{end}}">Rules</a>
    <a href="/ui/settings" class="text-sm {{if eq .Active "settings"}}text-white font-medium{{else}}text-slate-300 hover:text-white{{end}}">Settings</a>
    <a href="/ui/api-keys" class="text-sm {{if eq .Active "api-keys"}}text-white font-medium{{else}}text-slate-300 hover:text-white{{end}}">API keys</a>
    <span class="flex-1"></span>
    {{if .User}}<span class="text-sm text-slate-400">{{.User}}</span>{{end}}
    <button id="theme-toggle" type="button" title="Toggle theme"
      class="text-slate-300 hover:text-white rounded-md p-1.5 hover:bg-white/10">
      <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 hidden">
        <path d="M10 2a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 2zM10 15a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 15zM18 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0118 10zM5 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 015 10zM15.657 5.404a.75.75 0 010-1.06l1.06-1.06a.75.75 0 111.061 1.06l-1.06 1.06a.75.75 0 01-1.06 0zM3.222 16.778a.75.75 0 010-1.06l1.06-1.06a.75.75 0 011.061 1.06l-1.06 1.06a.75.75 0 01-1.06 0zM15.657 14.596a.75.75 0 011.06 0l1.06 1.06a.75.75 0 01-1.06 1.061l-1.06-1.06a.75.75 0 010-1.06zM3.222 3.222a.75.75 0 011.06 0l1.06 1.06a.75.75 0 01-1.06 1.061l-1.06-1.06a.75.75 0 010-1.06zM10 5.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9z"/>
      </svg>
      <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 hidden">
        <path fill-rule="evenodd" d="M7.455 2.004a.75.75 0 01.26.77 7 7 0 009.958 7.967.75.75 0 011.067.853A8.5 8.5 0 116.647 1.921a.75.75 0 01.808.083z" clip-rule="evenodd"/>
      </svg>
    </button>
    <a href="/ui/auth/logout" class="text-sm text-slate-300 hover:text-white">Log out</a>
  </nav>
  <main class="max-w-5xl mx-auto p-6">
    {{block "content" .}}{{end}}
  </main>
  <script>
    (function () {
      var sun = document.getElementById("theme-icon-sun");
      var moon = document.getElementById("theme-icon-moon");
      function sync() {
        var dark = document.documentElement.classList.contains("dark");
        sun.classList.toggle("hidden", !dark);
        moon.classList.toggle("hidden", dark);
      }
      sync();
      document.getElementById("theme-toggle").addEventListener("click", function () {
        document.documentElement.classList.toggle("dark");
        localStorage.theme = document.documentElement.classList.contains("dark") ? "dark" : "light";
        sync();
      });
    })();
  </script>
</body>
</html>
{{end}}
