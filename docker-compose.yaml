services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alertory
      POSTGRES_PASSWORD: alertory
      POSTGRES_DB: alertory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertory -d alertory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
