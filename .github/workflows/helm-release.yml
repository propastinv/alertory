name: Release Helm chart

# Runs on the same `vX.Y.Z` tag push as build.yml - one manual action
# (`git tag vX.Y.Z && git push origin vX.Y.Z`) ships both the app's
# Docker image and a matching Helm chart release, so a cluster running
# via this chart can actually pick up the new app version.
#
# Bumping only the chart's `appVersion` here would NOT be enough for
# that: `helm repo update`, `helm upgrade` without --version, and tools
# like Renovate all key off the chart's own `version` field in the
# published index - appVersion is just a label shown by `helm show
# chart`, nothing consults it to decide there's an update. So every
# run bumps `version` too (a plain patch increment, kept independent
# of the app's own tag numbering - it must stay monotonically
# increasing across releases regardless of what number the app happens
# to be tagged with) alongside `appVersion` (set to match the tag).
#
# One-time repo setup required before this works:
#   - Settings -> Pages -> Deploy from a branch -> gh-pages / (root)
#     (only selectable once the branch below actually exists)
#
# cr index does NOT create the gh-pages branch itself - `cr index
# --push` does a `git worktree add ... origin/gh-pages`, which fails
# with "fatal: invalid reference: origin/gh-pages" if that ref doesn't
# exist yet. The "Ensure gh-pages branch exists" step below creates it
# (an empty orphan branch) so the very first run doesn't fail on this.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Bump chart version and appVersion
        run: |
          set -euo pipefail
          app_version="${GITHUB_REF_NAME#v}"

          chart_version=$(grep '^version:' charts/alertory/Chart.yaml | awk '{print $2}')
          IFS='.' read -r major minor patch <<< "$chart_version"
          new_chart_version="$major.$minor.$((patch + 1))"

          sed -i "s/^version: .*/version: $new_chart_version/" charts/alertory/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$app_version\"/" charts/alertory/Chart.yaml

          git add charts/alertory/Chart.yaml
          git commit -m "chore(chart): release $new_chart_version for app $GITHUB_REF_NAME"
          git push origin HEAD:main

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            # We're on a detached HEAD (tag checkout, then a new commit
            # on top from the step above) - capture it by SHA, since
            # GITHUB_REF_NAME here is the tag, not a branch to check out.
            orig_ref=$(git rev-parse HEAD)
            git checkout --orphan gh-pages
            git reset --hard
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout "$orig_ref"
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
