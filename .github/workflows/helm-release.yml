name: Release Helm chart

# Two different things can trigger this, and they behave differently:
#
#   - `vX.Y.Z` (same tag build.yml reacts to): an app release. Bumps
#     the chart's `appVersion` to match the app tag, AND bumps the
#     chart's own `version` with an automatic patch increment (its
#     numbering is independent of the app's - it just has to keep
#     going up on its own, regardless of what the app happens to be
#     tagged). Bumping only appVersion would NOT be enough for anyone
#     to notice an update: `helm repo update`, `helm upgrade` without
#     --version, and Renovate all key off the chart's own `version` in
#     the published index, nothing consults appVersion to decide
#     there's something new.
#
#   - `chart-vX.Y.Z`: a chart-only release - values/templates/ingress
#     changes with no app change behind them. The chart's `version` is
#     set to exactly what's in the tag (chosen by hand - bump whatever
#     component makes sense, not just patch), and `appVersion` is left
#     untouched since no new app version actually shipped.
#
# One-time repo setup required before this works:
#   - Settings -> Pages -> Deploy from a branch -> gh-pages / (root)
#     (only selectable once the branch below actually exists)
#
# cr index does NOT create the gh-pages branch itself - `cr index
# --push` does a `git worktree add ... origin/gh-pages`, which fails
# with "fatal: invalid reference: origin/gh-pages" if that ref doesn't
# exist yet. The "Ensure gh-pages branch exists" step below creates it
# (an empty orphan branch) so the very first run doesn't fail on this.

on:
  push:
    tags:
      - "v*"
      - "chart-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Bump chart version and appVersion
        run: |
          set -euo pipefail
          ref="$GITHUB_REF_NAME"

          if [[ "$ref" == chart-v* ]]; then
            # Chart-only release: the tag itself IS the new chart
            # version, picked by hand - any component (major/minor/
            # patch) may change. appVersion is untouched.
            new_chart_version="${ref#chart-v}"
            sed -i "s/^version: .*/version: $new_chart_version/" charts/alertory/Chart.yaml
            commit_msg="chore(chart): release $new_chart_version (chart-only)"
          else
            # App release: appVersion follows the app tag; the chart's
            # own version gets an automatic patch bump. Plain integer
            # arithmetic, so 9->10, 99->100, etc. "just work" - no
            # special-casing needed for the rollover.
            app_version="${ref#v}"
            chart_version=$(grep '^version:' charts/alertory/Chart.yaml | awk '{print $2}')
            IFS='.' read -r major minor patch <<< "$chart_version"
            new_chart_version="$major.$minor.$((patch + 1))"

            sed -i "s/^version: .*/version: $new_chart_version/" charts/alertory/Chart.yaml
            sed -i "s/^appVersion: .*/appVersion: \"$app_version\"/" charts/alertory/Chart.yaml
            commit_msg="chore(chart): release $new_chart_version for app $ref"
          fi

          git add charts/alertory/Chart.yaml
          git commit -m "$commit_msg"
          git push origin HEAD:main

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            # We're on a detached HEAD (tag checkout, then a new commit
            # on top from the step above) - capture it by SHA, since
            # GITHUB_REF_NAME here is the tag, not a branch to check out.
            orig_ref=$(git rev-parse HEAD)
            git checkout --orphan gh-pages
            git reset --hard
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout "$orig_ref"
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
