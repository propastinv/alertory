name: Release Helm chart

# vX.Y.Z (app release): bumps appVersion to match, chart version gets
# an automatic patch bump.
# chart-vX.Y.Z (chart-only release): chart version is set to exactly
# what's in the tag, appVersion untouched.
#
# One-time setup: Settings -> Pages -> Deploy from a branch -> gh-pages
# (only selectable once that branch exists - see the step below).

on:
  push:
    tags:
      - "v*"
      - "chart-v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Bump chart version and appVersion
        run: |
          set -euo pipefail
          ref="$GITHUB_REF_NAME"

          if [[ "$ref" == chart-v* ]]; then
            new_chart_version="${ref#chart-v}"
            sed -i "s/^version: .*/version: $new_chart_version/" charts/alertory/Chart.yaml
            commit_msg="chore(chart): release $new_chart_version (chart-only)"
          else
            app_version="${ref#v}"
            chart_version=$(grep '^version:' charts/alertory/Chart.yaml | awk '{print $2}')
            IFS='.' read -r major minor patch <<< "$chart_version"
            new_chart_version="$major.$minor.$((patch + 1))"

            sed -i "s/^version: .*/version: $new_chart_version/" charts/alertory/Chart.yaml
            sed -i "s/^appVersion: .*/appVersion: \"$app_version\"/" charts/alertory/Chart.yaml
            commit_msg="chore(chart): release $new_chart_version for app $ref"
          fi

          echo "commit_msg=$commit_msg" >> "$GITHUB_ENV"
          echo "new_chart_version=$new_chart_version" >> "$GITHUB_ENV"

      - name: Open PR with chart bump
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ env.commit_msg }}
          title: ${{ env.commit_msg }}
          branch: chart-release/${{ github.ref_name }}
          base: main
          delete-branch: true
          add-paths: charts/alertory/Chart.yaml

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            orig_ref=$(git rev-parse HEAD)
            git checkout --orphan gh-pages
            git reset --hard
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout "$orig_ref"
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
