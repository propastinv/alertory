name: Release Helm chart

# Publishes charts/alertory as a proper Helm repository hosted on GitHub
# Pages, so `helm repo add alertory https://<owner>.github.io/<repo>`
# works. chart-releaser only packages+publishes a chart whose version
# (Chart.yaml) doesn't already have a matching GitHub release/tag, so
# bumping charts/alertory/Chart.yaml's `version` is what triggers a
# publish - pushing app changes without a chart version bump does not
# re-publish anything.
#
# One-time repo setup required before this works:
#   - Settings -> Pages -> Deploy from a branch -> gh-pages / (root)
#     (only selectable once the branch below actually exists)
#
# Despite what an earlier version of this comment claimed, cr index
# does NOT create the gh-pages branch itself - `cr index --push` does
# a `git worktree add ... origin/gh-pages`, which fails with "fatal:
# invalid reference: origin/gh-pages" if that ref doesn't exist yet.
# The "Ensure gh-pages branch exists" step below creates it (an empty
# orphan branch) so the very first run doesn't fail on this.

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git checkout --orphan gh-pages
            git reset --hard
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout "$GITHUB_REF_NAME"
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
