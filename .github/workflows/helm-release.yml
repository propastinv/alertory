name: Bump Helm chart version

# vX.Y.Z (app release): bumps appVersion to match, chart version gets
# an automatic patch bump.
# chart-vX.Y.Z (chart-only release): chart version is set to exactly
# what's in the tag, appVersion untouched.
#
# Opens a PR with the Chart.yaml bump instead of pushing to main
# directly, since main is rule-protected. Merging that PR is what
# actually triggers the publish (see helm-publish.yml).

on:
  push:
    tags:
      - "v*"
      - "chart-v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # peter-evans/create-pull-request sets its own Authorization
          # header from `token:`. If checkout also persists one via git
          # config, git ends up sending two Authorization headers and
          # GitHub rejects the request with 400 "Duplicate header".
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Bump chart version and appVersion
        run: |
          set -euo pipefail
          ref="$GITHUB_REF_NAME"

          if [[ "$ref" == chart-v* ]]; then
            new_chart_version="${ref#chart-v}"
            sed -i "s/^version: .*/version: $new_chart_version/" charts/alertory/Chart.yaml
            commit_msg="chore(chart): release $new_chart_version (chart-only)"
          else
            app_version="${ref#v}"
            chart_version=$(grep '^version:' charts/alertory/Chart.yaml | awk '{print $2}')
            IFS='.' read -r major minor patch <<< "$chart_version"
            new_chart_version="$major.$minor.$((patch + 1))"

            sed -i "s/^version: .*/version: $new_chart_version/" charts/alertory/Chart.yaml
            sed -i "s/^appVersion: .*/appVersion: \"$app_version\"/" charts/alertory/Chart.yaml
            commit_msg="chore(chart): release $new_chart_version for app $ref"
          fi

          echo "commit_msg=$commit_msg" >> "$GITHUB_ENV"
          echo "new_chart_version=$new_chart_version" >> "$GITHUB_ENV"

      - name: Open PR with chart bump
        id: chart-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ env.commit_msg }}
          title: ${{ env.commit_msg }}
          branch: chart-release/${{ github.ref_name }}
          base: main
          delete-branch: true
          add-paths: charts/alertory/Chart.yaml
