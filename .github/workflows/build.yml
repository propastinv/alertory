name: Build and Push alertory

# Triggered by pushing a `vX.Y.Z` tag - the single, manual "cut a
# release" action for this repo (see helm-release.yml, which reacts to
# the same tag to publish a matching Helm chart release). Replaces the
# old VERSION-file-based trigger: bumping a file and pushing it to main
# meant the "release" and "land this PR" actions were the same push,
# which made it easy to release by accident and impossible to build an
# image for a commit without also merging a VERSION bump for it. A tag
# is a deliberate, separate action from merging.

permissions:
  packages: write
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Derive version from tag
      id: version
      run: |
        version="${GITHUB_REF_NAME#v}"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Check if image already exists
      id: check_image
      run: |
        if docker manifest inspect "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Stop if image already exists
      if: steps.check_image.outputs.skip == 'true'
      run: echo "Image ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} already exists. Skipping build."

    - name: Log in to GitHub Container Registry
      if: steps.check_image.outputs.skip != 'true'
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker Image
      if: steps.check_image.outputs.skip != 'true'
      run: |
        docker build -t "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}" .

    - name: Push Docker Image
      if: steps.check_image.outputs.skip != 'true'
      run: |
        docker push "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"

    - name: Tag and push latest
      if: steps.check_image.outputs.skip != 'true'
      run: |
        docker tag "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}" "ghcr.io/${{ github.repository }}:latest"
        docker push "ghcr.io/${{ github.repository }}:latest"
